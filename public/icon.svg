<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a27"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#2a3d54" stroke-width="4"/>
  <g transform="translate(136, 120)" filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="0" y="160" width="56" height="120" rx="20" fill="url(#barGrad)"/>
    <!-- Bar 2 -->
    <rect x="92" y="80" width="56" height="200" rx="20" fill="url(#barGrad)"/>
    <!-- Bar 3 -->
    <rect x="184" y="0" width="56" height="280" rx="20" fill="url(#barGrad)"/>
  </g>
</svg>